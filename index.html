<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centered Flexbox Layout</title>
    <style>
        .flex-container{
            display: flex;
            justify-content: center;
        }
        .column-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <center>  
        <svg height="300" width="300"> 
           <circle cx="150" cy="190" r="100" stroke="green" 
              stroke-width="1" fill="favicon.png" /> 
        </svg> 
     <h2> WEB tech lab d</h2>
    </center> 
    <div class="flex-container">
        <div class="column-container"> 
            <div style="background-color: rgb(130, 160, 70);height: 250px;width: 150px;"></div>
            <div style="background-color:rgb(26, 121, 184);height: 150px;width: 150px;"></div> 
        </div>
        <div style="background-color: rgb(161, 33, 212);height: 400px;width: 200px;"></div>
        </div>
</body>
</html>
